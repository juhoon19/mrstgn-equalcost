# Fly.io, all-in-one on one machine (shards + gateways as processes).
#   fly launch --config deploy/fly.toml --copy-config --no-deploy
#   fly volumes create evo_data --size 3 --region hkg     (world snapshots + accounts DB live here)
#   fly secrets set CLUSTER_SECRET=$(openssl rand -hex 16) TOKEN_SECRET=$(openssl rand -hex 16) ADMIN_TOKEN=$(openssl rand -hex 24)
#   fly deploy --config deploy/fly.toml      (run from the project root)
app = "evo-soup"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  SHARDS = "3"
  GATEWAYS = "2"
  WORLD = "24x24"
  TRUST_PROXY = "true"
  QUIET = "true"

# Without a volume every deploy would wipe the world AND every player account.
[mounts]
  source = "evo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2500

[[http_service.checks]]
  path = "/healthz"
  interval = "15s"
  timeout = "3s"

[[vm]]
  size = "performance-4x"
